<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Form</title>
</head>
<body>

<h2>Book Form</h2>

<form action="/books/save" method="post" th:object="${book}">
    <input type="hidden" th:field="*{id}"/>

    Title: <input type="text" th:field="*{title}"/><br>
    Author: <input type="text" th:field="*{author}"/><br>
    Price: <input type="number" th:field="*{price}"/><br>
    Year: <input type="number" th:field="*{publishedYear}"/><br>

    Category:
    <select th:field="*{category}">
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.name}"></option>
    </select>

    <br>
    <button type="submit">Save</button>
</form>

</body>
</html>
